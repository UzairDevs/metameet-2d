# Render Blueprint — deploys the backend (Node web service) and the
# frontend (static site) together. Import via Render dashboard > "New +" >
# "Blueprint", point it at this repo, then fill in the env vars marked below.
#
# Deploy order note: the two services reference each other's URLs. Backend
# CORS defaults to "*", so it works before you know the frontend URL. After
# both exist, set CLIENT_ORIGIN (backend) and VITE_SOCKET_URL/VITE_API_URL
# (frontend) to the real URLs and redeploy the frontend.

services:
  # ---------------- Backend: Socket.io + REST API ----------------
  - type: web
    name: metameet-backend
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      # Set to your frontend URL once known (e.g. https://metameet-frontend.onrender.com).
      # Leave unset to allow all origins.
      - key: CLIENT_ORIGIN
        sync: false

  # ---------------- Frontend: Vite static site ----------------
  - type: web
    name: metameet-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    # SPA fallback so client-side routing / refreshes serve index.html
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      # Point these at the backend service URL above (same value for both).
      - key: VITE_SOCKET_URL
        sync: false
      - key: VITE_API_URL
        sync: false
      # Optional TURN config for WebRTC (see frontend/.env.example)
      - key: VITE_TURN_URL
        sync: false
      - key: VITE_TURN_USERNAME
        sync: false
      - key: VITE_TURN_CREDENTIAL
        sync: false
